name: Deploy to FastAPI Cloud

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "fastapi[standard]>=0.115.0"

      - name: Run test suite
        run: |
          pytest tests/test_weather.py tests/test_sdk_schemas.py tests/test_preprocessing.py tests/test_baseline_and_predictor.py -v

      - name: Deploy to FastAPI Cloud
        env:
          FASTAPI_TOKEN: ${{ secrets.FASTAPI_CLOUD_TOKEN }}
          FASTAPI_APP_ID: ${{ secrets.FASTAPI_CLOUD_APP_ID }}
        run: |
          if [ -z "$FASTAPI_TOKEN" ]; then
            echo "ERROR: FASTAPI_CLOUD_TOKEN secret is not set. Add it in GitHub Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          fastapi deploy
